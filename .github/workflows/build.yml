name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          sparse-checkout: |
            /*
            !/AudioLibraryToolkit.Desktop/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ pkg-config patchelf
      - uses: actions/cache@v4
        with:
          path: external/ffmpeg
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('cmake/ffmpeg-lock.json') }}
      - name: Restore locked FFmpeg SDK
        run: python tools/prepare_ffmpeg.py
      - name: Configure
        run: cmake --preset linux-${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset linux-${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --preset linux-${{ matrix.configuration }}
      - name: Install
        run: cmake --install out/build/linux-${{ matrix.configuration }}
      - name: Verify relocated installed runtime
        run: python tests/bundled_runtime.py --converter out/install/linux-${{ matrix.configuration }}/bin/AudioLibraryToolkit
      - name: Create development package
        if: matrix.configuration == 'release'
        run: python tools/package_application.py --build-dir out/build/linux-release --development

  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          sparse-checkout: |
            /*
            !/AudioLibraryToolkit.Desktop/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: external/ffmpeg
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('cmake/ffmpeg-lock.json') }}
      - name: Restore locked FFmpeg SDK
        run: python tools/prepare_ffmpeg.py
      - name: Configure
        run: cmake --preset windows-${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset windows-${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --preset windows-${{ matrix.configuration }}
      - name: Install
        run: cmake --install out/build/windows-${{ matrix.configuration }}
      - name: Verify relocated installed runtime
        run: python tests/bundled_runtime.py --converter out/install/windows-${{ matrix.configuration }}/bin/AudioLibraryToolkit.exe
      - name: Create development package
        if: matrix.configuration == 'release'
        run: python tools/package_application.py --build-dir out/build/windows-release --development
